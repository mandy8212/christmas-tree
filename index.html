<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圣诞树代码合集 // Christmas Tree Collection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #060b19 0%, #010307 100%);
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #fff;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 顶部标题区域 */
    .header-box {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
      width: 100%;
      padding: 0 20px;
    }
    .header-box h1 {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 6px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ff416c, #ff4b2b, #ff00cc, #00ffff, #ffea00);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientText 6s ease infinite, glow 2s ease-in-out infinite alternate;
    }
    .header-box p {
      font-size: clamp(11px, 2.5vw, 14px);
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.7);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    @keyframes gradientText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px rgba(255, 65, 108, 0.5), 0 0 20px rgba(0, 255, 255, 0.3); }
      to { text-shadow: 0 0 20px rgba(255, 65, 108, 0.8), 0 0 30px rgba(255, 234, 0, 0.6); }
    }

    /* 音乐控制按钮 */
    .music-btn {
      position: absolute;
      top: 25px;
      right: 25px;
      z-index: 12;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
    }
    .music-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.08);
    }
    .music-btn svg {
      fill: #fff;
      width: 20px;
      height: 20px;
    }
    .music-btn.playing {
      animation: rotateDisc 4s linear infinite;
    }
    @keyframes rotateDisc {
      100% { transform: rotate(360deg); }
    }

    /* 底部合集切换面板 */
    .nav-panel {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      padding: 6px 10px;
      display: flex;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 255, 255, 0.05);
      max-width: 95%;
      overflow-x: auto;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .nav-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .nav-btn.active {
      color: #fff;
      font-weight: bold;
    }
    /* 不同风格按钮的霓虹高亮 */
    .nav-btn.active[data-tree="0"] { background: linear-gradient(135deg, #ff007f, #ff4b2b); box-shadow: 0 0 15px rgba(255, 0, 127, 0.6); }
    .nav-btn.active[data-tree="1"] { background: linear-gradient(135deg, #00f2fe, #4facfe); box-shadow: 0 0 15px rgba(0, 242, 254, 0.6); }
    .nav-btn.active[data-tree="2"] { background: linear-gradient(135deg, #f857a6, #ff5858); box-shadow: 0 0 15px rgba(248, 87, 166, 0.6); }
    .nav-btn.active[data-tree="3"] { background: linear-gradient(135deg, #00ff87, #60efff); box-shadow: 0 0 15px rgba(0, 255, 135, 0.6); }

    /* 提示点击开始播放音乐 */
    .music-tip {
      position: absolute;
      top: 75px;
      right: 25px;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      color: #ffea00;
      z-index: 11;
      pointer-events: none;
      opacity: 0.8;
      animation: pulseTip 1.5s infinite alternate;
    }
    @keyframes pulseTip {
      0% { transform: translateY(0); }
      100% { transform: translateY(-3px); }
    }
  </style>
</head>
<body>

  <div class="header-box">
    <h1>圣诞树代码合集</h1>
    <p id="tree-subtitle">🌟 浪漫星河粒子树 // 伴随落雪与音乐 🌟</p>
  </div>

  <!-- 音乐控制 -->
  <button class="music-btn" id="musicBtn" title="播放音乐">
    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h6V3h-8z"/></svg>
  </button>
  <div class="music-tip" id="musicTip">点击播放节日音乐 🎵</div>

  <!-- 背景音乐 (免版权圣诞音乐流) -->
  <audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <canvas id="treeCanvas"></canvas>

  <!-- 合集导航条 -->
  <div class="nav-panel">
    <button class="nav-btn active" data-tree="0" data-sub="✨ 1号：浪漫星河粒子树 // 璀璨星群">浪漫星河粒子</button>
    <button class="nav-btn" data-tree="1" data-sub="⚡ 2号：赛博炫彩螺旋树 // 全息律动">赛博炫彩螺旋</button>
    <button class="nav-btn" data-tree="2" data-sub="🌸 3号：粉金梦幻雪夜树 // 少女心浪漫">粉金梦幻雪夜</button>
    <button class="nav-btn" data-tree="3" data-sub="🌌 4号：极光繁星粒子树 // 奇幻极夜">极光繁星粒子</button>
  </div>

  <script>
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 音乐播放控制
    const musicBtn = document.getElementById('musicBtn');
    const bgMusic = document.getElementById('bgMusic');
    const musicTip = document.getElementById('musicTip');

    musicBtn.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          musicBtn.classList.add('playing');
          musicTip.style.display = 'none';
        }).catch(() => {});
      } else {
        bgMusic.pause();
        musicBtn.classList.remove('playing');
      }
    });

    // 状态管理
    let currentTreeType = 0;
    let angleY = 0;
    let timeTick = 0;

    // 基础落雪数据
    const snows = [];
    for (let i = 0; i < 150; i++) {
      snows.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 2 + 0.6,
        speed: Math.random() * 1.2 + 0.4,
        drift: Math.random() * 0.6 - 0.3
      });
    }

    // 树粒子总生成
    let particles = [];
    function generateTree(type) {
      particles = [];
      const count = 1800;

      if (type === 0) { // 1. 浪漫星河粒子树
        for (let i = 0; i < count; i++) {
          const ratio = i / count;
          const radius = Math.pow(ratio, 1.2) * 165;
          const theta = ratio * Math.PI * 24;
          const y = -220 + ratio * 430;
          particles.push({
            x: Math.cos(theta) * radius, y: y, z: Math.sin(theta) * radius,
            color: Math.random() < 0.7 ? `hsl(${Math.random() * 40 + 340}, 100%, 70%)` : `hsl(${Math.random() * 40 + 40}, 100%, 65%)`,
            size: Math.random() * 1.8 + 0.8,
            sparkle: Math.random() * 0.1,
            isStar: Math.random() < 0.15
          });
        }
      } 
      else if (type === 1) { // 2. 赛博炫彩螺旋
        for (let i = 0; i < count; i++) {
          const ratio = i / count;
          const radius = Math.pow(ratio, 1.1) * 175;
          const theta = ratio * Math.PI * 18 + Math.floor(ratio * 4) * (Math.PI / 2);
          const y = -210 + ratio * 420;
          particles.push({
            x: Math.cos(theta) * radius, y: y, z: Math.sin(theta) * radius,
            color: `hsl(${(ratio * 360 + i * 0.5) % 360}, 100%, 65%)`,
            size: Math.random() * 2.2 + 0.7,
            sparkle: Math.random() * 0.05,
            isStar: Math.random() < 0.1
          });
        }
      } 
      else if (type === 2) { // 3. 粉金梦幻雪夜树
        for (let i = 0; i < count; i++) {
          const ratio = i / count;
          const radius = Math.pow(ratio, 1.3) * 160;
          const theta = ratio * Math.PI * 28 + (Math.random() * 0.3);
          const y = -220 + ratio * 430;
          const isGold = Math.random() < 0.35;
          particles.push({
            x: Math.cos(theta) * radius, y: y, z: Math.sin(theta) * radius,
            color: isGold ? `hsl(45, 100%, ${65 + Math.random() * 20}%)` : `hsl(${330 + Math.random() * 25}, 100%, ${70 + Math.random() * 15}%)`,
            size: Math.random() * 2.0 + 0.8,
            sparkle: Math.random() * 0.15,
            isStar: Math.random() < 0.2
          });
        }
      } 
      else if (type === 3) { // 4. 极光繁星粒子树
        for (let i = 0; i < count; i++) {
          const ratio = i / count;
          const radius = Math.pow(ratio, 1.2) * 170;
          const theta = ratio * Math.PI * 22;
          const y = -210 + ratio * 430;
          particles.push({
            x: Math.cos(theta) * radius, y: y, z: Math.sin(theta) * radius,
            color: Math.random() < 0.65 ? `hsl(${140 + Math.random() * 50}, 100%, 65%)` : `hsl(${190 + Math.random() * 40}, 100%, 65%)`,
            size: Math.random() * 1.8 + 0.8,
            sparkle: Math.random() * 0.08,
            isStar: Math.random() < 0.15
          });
        }
      }
    }

    generateTree(currentTreeType);

    // 绘制立体发光星
    function drawTopStar(cx, cy, size, color) {
      ctx.save();
      ctx.shadowBlur = 25;
      ctx.shadowColor = color;
      ctx.beginPath();
      let rot = Math.PI / 2 * 3;
      let step = Math.PI / 5;
      ctx.moveTo(cx, cy - size);
      for (let i = 0; i < 5; i++) {
        let x = cx + Math.cos(rot) * size;
        let y = cy + Math.sin(rot) * size;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * (size * 0.45);
        y = cy + Math.sin(rot) * (size * 0.45);
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    // 绘制底部发光反射环
    function drawBaseRing(cx, cy, radius, color) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1, 0.26);
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 15;
      ctx.shadowColor = color;
      ctx.stroke();
      ctx.restore();
    }

    // 动画循环
    function animate() {
      ctx.fillStyle = 'rgba(3, 6, 15, 0.18)';
      ctx.fillRect(0, 0, width, height);

      angleY += 0.012;
      timeTick += 1;

      const fov = 400;
      const cx = width / 2;
      const cy = height / 2 + 10;

      // 1. 绘制环境落雪
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      for (let s of snows) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.y += s.speed;
        s.x += s.drift;
        if (s.y > height) {
          s.y = 0;
          s.x = Math.random() * width;
        }
      }

      // 2. 3D 渲染与排序
      const projected = particles.map(p => {
        const rotX = p.x * Math.cos(angleY) - p.z * Math.sin(angleY);
        const rotZ = p.x * Math.sin(angleY) + p.z * Math.cos(angleY);
        const scale = fov / (fov + rotZ + 180);
        return {
          x2d: cx + rotX * scale,
          y2d: cy + p.y * scale,
          z: rotZ,
          scale: scale,
          size: p.size,
          color: p.color,
          sparkle: p.sparkle,
          isStar: p.isStar
        };
      }).sort((a, b) => b.z - a.z);

      // 3. 渲染底环
      let ringColor = '#ff416c';
      if (currentTreeType === 1) ringColor = '#00ffff';
      if (currentTreeType === 2) ringColor = '#ff69b4';
      if (currentTreeType === 3) ringColor = '#00ff87';
      drawBaseRing(cx, cy + 225, 120, ringColor);

      // 4. 渲染粒子
      for (let p of projected) {
        ctx.beginPath();
        let currentSize = p.size * p.scale;
        if (p.isStar && Math.sin(timeTick * p.sparkle) > 0.4) {
          currentSize *= 1.8;
          ctx.shadowBlur = 10;
          ctx.shadowColor = p.color;
        } else {
          ctx.shadowBlur = 0;
        }
        ctx.arc(p.x2d, p.y2d, currentSize, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }

      // 5. 渲染顶星
      let starColor = '#ffe600';
      if (currentTreeType === 1) starColor = '#00ffff';
      if (currentTreeType === 2) starColor = '#fff';
      if (currentTreeType === 3) starColor = '#00ffcc';
      const starScale = fov / (fov + 180);
      drawTopStar(cx, cy - 232 * starScale, 20, starColor);

      requestAnimationFrame(animate);
    }

    animate();

    // 导航切换处理
    const btns = document.querySelectorAll('.nav-btn');
    const subtitle = document.getElementById('tree-subtitle');

    btns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        btns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        
        const type = parseInt(e.target.getAttribute('data-tree'));
        currentTreeType = type;
        subtitle.innerText = e.target.getAttribute('data-sub');
        generateTree(type);
      });
    });
  </script>
</body>

<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>Cyberpunk Rainbow Particle Christmas Tree 2026</title>
  <style>

<body>

  <div class="overlay-ui">
    <div>SYS: <span class="tag">CYBER_TREE_v2.0_RAINBOW</span></div>
    <div>PARTICLES: <span class="tag">ACTIVE // 1800+</span></div>
    <div>FREQ: <span class="tag">60HZ // 3D_MATRIX</span></div>
    <div>COLOR: <span class="tag">SPECTRUM_CYCLE_AUTO</span></div>
  </div>

  <div class="title-box">
    <h1>MERRY CHRISTMAS</h1>
    <p>CYBERPUNK PARTICLE MATRIX // 2026</p>
  </div>

  <canvas id="cyberCanvas"></canvas>

  <script>
    const canvas = document.getElementById('cyberCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 基础配置
    const particles = [];
    const particleCount = 1800; // 粒子数量
    const snows = [];
    const snowCount = 120;
    const digitalBeams = []; // 上升数据光束

    let angleY = 0; // 旋转角度
    let globalHueOffset = 0; // 全局色相变幻速度

    // 初始化圣诞树粒子 (基于3D锥形螺旋与分形噪声)
    for (let i = 0; i < particleCount; i++) {
      const ratio = i / particleCount; // 0 到 1 (树顶到树底)
      
      // 形成赛博圆锥形螺旋
      const radius = Math.pow(ratio, 1.2) * 190 + 5; // 下大上小
      const turns = 18 * Math.PI * 2; // 螺旋圈数
      const theta = ratio * turns + (Math.random() * 0.4); 
      
      // Y轴：树顶是 -230，树底是 +190
      const y = -230 + ratio * 420;
      
      // 3D 坐标
      const x = Math.cos(theta) * radius;
      const z = Math.sin(theta) * radius;

      // 粒子属性
      particles.push({
        baseX: x,
        baseY: y,
        baseZ: z,
        x: x,
        y: y,
        z: z,
        ratio: ratio,
        theta: theta,
        radius: radius,
        size: Math.random() * 2.2 + 0.8,
        speed: 0.02 + Math.random() * 0.03,
        pulseOffset: Math.random() * Math.PI * 2,
        hueSeed: Math.random() * 360,
        // 部分粒子作为高亮装饰节点/全息魔方
        isDecor: Math.random() < 0.12,
        decorType: Math.floor(Math.random() * 3) // 0:球, 1:菱形, 2:环
      });
    }

    // 初始化赛博数码降雪
    for (let i = 0; i < snowCount; i++) {
      snows.push({
        x: Math.random() * width,
        y: Math.random() * height,
        z: Math.random() * 400 - 200,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 1.5 + 0.6,
        alpha: Math.random() * 0.6 + 0.2,
        color: Math.random() < 0.3 ? '#00ffff' : '#ffffff'
      });
    }

    // 初始化上升数据光束
    for (let i = 0; i < 25; i++) {
      digitalBeams.push({
        x: (Math.random() - 0.5) * 380,
        y: Math.random() * 400 - 180,
        z: (Math.random() - 0.5) * 380,
        length: Math.random() * 40 + 15,
        speed: Math.random() * 2 + 1,
        hue: Math.random() * 360
      });
    }

    // 绘制3D全息科技树顶星
    function drawCyberStar(ctx, cx, cy, size, hue) {
      ctx.save();
      ctx.shadowBlur = 25;
      ctx.shadowColor = `hsl(${hue}, 100%, 70%)`;
      ctx.lineWidth = 1.5;

      const spikes = 8;
      const innerRadius = size * 0.4;
      const outerRadius = size;
      let rot = Math.PI / 2 * 3;
      let step = Math.PI / spikes;

      // 外星芒
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        let r = (i % 2 === 0) ? outerRadius : innerRadius;
        let x = cx + Math.cos(rot) * r;
        let y = cy + Math.sin(rot) * r;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.closePath();
      ctx.fillStyle = `hsla(${hue}, 100%, 85%, 0.8)`;
      ctx.strokeStyle = `hsl(${(hue + 180) % 360}, 100%, 75%)`;
      ctx.fill();
      ctx.stroke();

      // 内层几何十字/电路星环
      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.35, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      // 十字光束
      ctx.beginPath();
      ctx.moveTo(cx - size * 1.5, cy); ctx.lineTo(cx + size * 1.5, cy);
      ctx.moveTo(cx, cy - size * 1.5); ctx.lineTo(cx, cy + size * 1.5);
      ctx.strokeStyle = `hsla(${hue}, 100%, 75%, 0.5)`;
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();
    }

    // 动画循环
    function animate() {
      // 拖尾特效，形成赛博光痕
      ctx.fillStyle = 'rgba(3, 3, 10, 0.16)';
      ctx.fillRect(0, 0, width, height);

      angleY += 0.012; // 自动旋转
      globalHueOffset += 0.6; // 彩虹色相流转

      const fov = 420; // 3D 视角透视距离
      const cx = width / 2;
      const cy = height / 2 - 20;

      // 1. 绘制背景网格/地表反射线
      ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 15; i++) {
        let gridY = height * 0.72 + i * 22;
        ctx.beginPath();
        ctx.moveTo(0, gridY);
        ctx.lineTo(width, gridY);
        ctx.stroke();
      }

      // 2. 更新并绘制雪花
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      for (let s of snows) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.fill();

        s.y += s.speed;
        s.x += Math.sin(s.y * 0.02) * 0.5;
        if (s.y > height) {
          s.y = 0;
          s.x = Math.random() * width;
        }
      }

      // 3. 计算并排序3D粒子（实现前后遮挡纵深感）
      const projected = [];

      for (let p of particles) {
        // 让粒子产生赛博波动与微颤
        const pulse = Math.sin(angleY * 4 + p.pulseOffset) * 4;
        const currentRadius = p.radius + pulse;

        // 3D 旋转变换 (绕 Y 轴)
        const rotX = Math.cos(p.theta + angleY) * currentRadius;
        const rotZ = Math.sin(p.theta + angleY) * currentRadius;
        const rotY = p.y;

        // 透视投影
        const scale = fov / (fov + rotZ + 180);
        const x2d = cx + rotX * scale;
        const y2d = cy + rotY * scale;

        // 赛博七彩变色逻辑：根据高度(ratio)、角度(theta)与时间(globalHueOffset)混合生成彩虹渐变
        const hue = (p.ratio * 260 + (p.theta / (Math.PI * 2)) * 80 + globalHueOffset) % 360;

        projected.push({
          x2d: x2d,
          y2d: y2d,
          z: rotZ,
          scale: scale,
          size: p.size,
          hue: hue,
          isDecor: p.isDecor,
          decorType: p.decorType,
          ratio: p.ratio
        });
      }

      // 4. 投影光束更新与转换
      for (let b of digitalBeams) {
        b.y -= b.speed;
        if (b.y < -230) {
          b.y = 190;
          b.x = (Math.random() - 0.5) * 350;
        }
        const rotX = b.x * Math.cos(angleY) - b.z * Math.sin(angleY);
        const rotZ = b.x * Math.sin(angleY) + b.z * Math.cos(angleY);
        const scale = fov / (fov + rotZ + 180);
        
        projected.push({
          type: 'beam',
          x2d: cx + rotX * scale,
          y2d: cy + b.y * scale,
          y2dEnd: cy + (b.y + b.length) * scale,
          z: rotZ,
          hue: (b.hue + globalHueOffset) % 360,
          scale: scale
        });
      }

      // 按 Z 深度从后往前排序
      projected.sort((a, b) => b.z - a.z);

      // 5. 渲染排序后的粒子/线条/光束
      for (let p of projected) {
        if (p.type === 'beam') {
          // 渲染数据光束
          ctx.beginPath();
          ctx.moveTo(p.x2d, p.y2d);
          ctx.lineTo(p.x2d, p.y2dEnd);
          ctx.strokeStyle = `hsla(${p.hue}, 100%, 70%, ${0.15 * p.scale})`;
          ctx.lineWidth = 1.5 * p.scale;
          ctx.stroke();
          continue;
        }

        // 渲染树身粒子
        const alpha = Math.min(1, 0.4 + p.scale * 0.6);
        ctx.shadowBlur = p.isDecor ? 12 : 0;
        ctx.shadowColor = `hsl(${p.hue}, 100%, 65%)`;

        ctx.beginPath();
        if (p.isDecor) {
          // 赛博全息装饰挂件 (菱形/大光球/多边形)
          ctx.arc(p.x2d, p.y2d, p.size * p.scale * 2.5, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${p.hue}, 100%, 75%, ${alpha})`;
          ctx.fill();
          
          ctx.strokeStyle = `hsla(${(p.hue + 120) % 360}, 100%, 85%, 0.8)`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        } else {
          // 普通彩虹微粒子
          ctx.arc(p.x2d, p.y2d, p.size * p.scale, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${alpha})`;
          ctx.fill();
        }
      }
      ctx.shadowBlur = 0; // 重置阴影

      // 6. 渲染树顶星 (始终在最顶层)
      const starScale = fov / (fov + 180);
      const starY = cy - 238 * starScale;
      drawCyberStar(ctx, cx, starY, 22, globalHueOffset % 360);

      // 7. 树底座赛博全息环与光束倒影
      ctx.save();
      ctx.translate(cx, cy + 205);
      ctx.scale(1, 0.28); // 压扁成椭圆透视环
      
      for (let r = 1; r <= 3; r++) {
        ctx.beginPath();
        ctx.arc(0, 0, r * 45, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${(globalHueOffset + r * 60) % 360}, 100%, 60%, ${0.4 / r})`;
        ctx.lineWidth = 3 / r;
        ctx.stroke();
      }
      ctx.restore();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
